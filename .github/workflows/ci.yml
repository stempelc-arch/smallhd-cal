name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tk GUI + macOS-only display APIs (see src/smallhd_cal/displays.py), so
    # CI runs on the same platform the app actually targets rather than Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      # `python -m pytest` (not the bare `pytest` entrypoint): it puts the repo
      # root on sys.path, which test_refine.py/test_session.py need for their
      # `from tests.test_calibration import ...` helper imports. The bare
      # entrypoint doesn't, since tests/ has no __init__.py.
      - name: Pytest
        run: python -m pytest -q
